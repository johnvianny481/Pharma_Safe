[project]
name = "pharmasafe-ai-gateway"
version = "0.1.0"
description = "Internal AI gateway: the only path to LLM providers"
requires-python = "==3.12.*"
dependencies = [
    "pharmasafe-domain",
    "pharmasafe-platform",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
