# Alembic config for the PharmaSafe database. Run from the repo root:
#   uv run alembic -c apps/api/alembic.ini upgrade head
# The connection URL comes from PHARMASAFE_MIGRATION_DATABASE_URL (the schema owner).
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
